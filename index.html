<html lang="es">
<head>

<title>CUSTODIA · Cadena de Custodia de Evidencia Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23137f88'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style id="app-css">
/* ==========================================================
   CUSTODIA · Sistema de Cadena de Custodia de Evidencia Digital
   Estilos basados en el diseño de Figma (Fase 3)
   ========================================================== */
:root {
  --sidebar: #142f49;
  --sidebar-active: #226275;
  --sidebar-text: #c4d3e1;
  --sidebar-muted: #90a9bf;
  --brand: #137f88;
  --primary: #0f6a72;
  --primary-hover: #0b565d;
  --bg: #f4f7fa;
  --card: #ffffff;
  --border: #e1e8ef;
  --input-bg: #f9fbfd;
  --text: #17324d;
  --muted: #6b7f93;
  --green-bg: #e6f4ec; --green: #23733f;
  --yellow-bg: #fdf3d7; --yellow: #7a5a00;
  --red-bg: #fde7e7; --red: #b3261e;
  --blue-bg: #e6f0fa; --blue: #1f5d99;
  --gray-bg: #eef1f4; --gray: #55677a;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 47, 73, .05);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
}
a { color: var(--primary); }
h1, h2, h3 { margin: 0; color: var(--text); }
code, .mono { font-family: Consolas, "Courier New", monospace; font-size: .9em; word-break: break-all; }
.hidden { display: none !important; }

/* ---------- Layout ---------- */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px; flex-shrink: 0; background: var(--sidebar); color: #fff;
  display: flex; flex-direction: column; padding: 28px 14px 20px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px; margin-bottom: 34px; text-decoration: none; }
.brand-logo {
  width: 34px; height: 34px; border-radius: 9px; background: var(--brand);
  display: grid; place-items: center; font-weight: 700; font-size: 21px; color: #fff;
}
.brand-name { font-weight: 700; font-size: 17px; color: #fff; letter-spacing: .3px; }
.brand-sub { font-size: 12px; color: #afc3d5; }
.nav-title { font-size: 10px; font-weight: 700; color: var(--sidebar-muted); letter-spacing: .6px; padding: 0 10px; margin: 6px 0 10px; text-transform: uppercase; }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  color: var(--sidebar-text); text-decoration: none; padding: 10px 15px; border-radius: 7px;
  font-size: 15px; margin-bottom: 4px;
}
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav a.active { background: var(--sidebar-active); color: #fff; font-weight: 700; }
.nav .count { background: #c0392b; color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; font-weight: 700; }
.sidebar-foot { margin-top: auto; padding: 18px 10px 0; font-size: 12px; color: var(--sidebar-muted); }
.sidebar-foot b { display: block; font-size: 11px; letter-spacing: .5px; margin-bottom: 4px; }
.sidebar-foot button { margin-top: 10px; background: transparent; border: 1px solid #3b5a77; color: var(--sidebar-text); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; width: 100%; }
.sidebar-foot button:hover { background: rgba(255,255,255,.06); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: #fff; border-bottom: 1px solid var(--border); height: 78px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
}
.topbar .sys b { display: block; font-size: 14px; }
.topbar .sys span { font-size: 12px; color: var(--muted); }
.userbox { display: flex; align-items: center; gap: 16px; }
.userbox .who b { display: block; font-size: 14px; }
.userbox .who span { font-size: 12px; color: var(--muted); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #dfeaf2; color: var(--sidebar); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.menu-toggle { display: none; background: none; border: 0; font-size: 24px; cursor: pointer; color: var(--text); }

.content { padding: 30px 40px 40px; max-width: 1180px; width: 100%; }
.eyebrow { font-size: 11px; font-weight: 700; color: var(--brand); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
.page-title { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
.page-sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
.footer-note { border-top: 1px solid var(--border); margin-top: 36px; padding-top: 14px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 12px; flex-wrap: wrap; }

/* ---------- Cards ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 22px; box-shadow: var(--shadow); }
.card h2 { font-size: 18px; margin-bottom: 14px; }
.card h3 { font-size: 15px; margin-bottom: 8px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2 { margin: 0; }
.grid { display: grid; gap: 22px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { margin-bottom: 0; }
.kpi .label { font-size: 15px; font-weight: 700; }
.kpi .value { font-size: 32px; font-weight: 700; margin-top: 10px; }
.kpi .hint { font-size: 12px; color: var(--muted); }
.kpi.red .value { color: var(--red); }
.kpi.yellow .value { color: var(--yellow); }

/* ---------- Datos clave/valor ---------- */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 40px; }
.fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field .k { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
.field .v { font-size: 15px; font-weight: 700; word-break: break-word; }
.field .v.normal { font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

/* ---------- Formularios ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 40px; }
.form-grid .full { grid-column: 1 / -1; }
label.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
label.lbl .req { color: var(--red); }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=datetime-local], input[type=date], select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid #d6e0ea; border-radius: 7px;
  background: var(--input-bg); color: var(--text); font: inherit; font-size: 15px;
}
textarea { min-height: 86px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(19, 127, 136, .25); border-color: var(--brand); background: #fff; }
input[readonly], .readonly { background: #eef2f6; color: var(--muted); }
.invalid { border-color: var(--red) !important; background: #fff8f8 !important; }
.err-msg { color: var(--red); font-size: 12px; margin-top: 4px; }
input[type=file] { font: inherit; font-size: 14px; }
.check { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; margin: 6px 0; }
.check input { margin-top: 3px; }
.form-actions { display: flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; align-items: center; }
fieldset { border: 1px dashed #cfdbe6; border-radius: 8px; padding: 14px 16px 16px; margin: 0; }
legend { font-size: 13px; font-weight: 700; padding: 0 6px; color: var(--text); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 7px; border: 1px solid #d6e0ea; background: #fff;
  color: var(--text); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: #f3f7fa; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.danger { background: #fff; border-color: #efb7b3; color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.success { background: #23733f; border-color: #23733f; color: #fff; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled], .btn.disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Badges / semáforo ---------- */
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.badge.green { background: var(--green-bg); color: var(--green); }
.badge.yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge.red { background: var(--red-bg); color: var(--red); }
.badge.blue { background: var(--blue-bg); color: var(--blue); }
.badge.gray { background: var(--gray-bg); color: var(--gray); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
.dot.green { background: #2e9e57; } .dot.yellow { background: #e0a800; } .dot.red { background: #d93025; } .dot.gray { background: #9aa8b5; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; }

/* ---------- Tablas ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 10px 10px; border-bottom: 1px solid var(--border); background: #f8fafc; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid #edf1f5; vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: #f6f9fb; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 14px; }

/* ---------- Listas de pendientes ---------- */
.item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #edf1f5; }
.item:last-child { border-bottom: 0; padding-bottom: 0; }
.item:first-child { padding-top: 0; }
.item .t { font-weight: 700; font-size: 15px; }
.item .s { color: var(--muted); font-size: 13.5px; }

/* ---------- Avisos ---------- */
.alert { border-radius: 8px; padding: 13px 16px; font-size: 14px; margin-bottom: 18px; border: 1px solid; }
.alert b { display: block; margin-bottom: 2px; }
.alert.info { background: var(--blue-bg); border-color: #c6dbf0; color: #1d4f80; }
.alert.ok { background: var(--green-bg); border-color: #bfe2cc; color: #1d5f34; }
.alert.warn { background: var(--yellow-bg); border-color: #f1dc9c; color: #6b4f00; }
.alert.error { background: var(--red-bg); border-color: #f3c2bf; color: #8f1f18; }

/* ---------- Checklist de cierre ---------- */
.check-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #edf1f5; }
.check-row:last-child { border-bottom: 0; }
.check-row ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }

/* ---------- Línea de tiempo ---------- */
.timeline { position: relative; margin: 6px 0 0; padding: 0; list-style: none; }
.timeline::before { content: ""; position: absolute; left: 66px; top: 6px; bottom: 6px; width: 2px; background: #dbe4ec; }
.timeline li { display: grid; grid-template-columns: 54px 26px 1fr; gap: 0 12px; padding: 0 0 20px; position: relative; }
.timeline .time { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; padding-top: 1px; line-height: 1.2; }
.timeline .time small { display: block; font-weight: 400; font-size: 11px; }
.timeline .mark { width: 14px; height: 14px; border-radius: 50%; background: var(--brand); border: 3px solid #fff; box-shadow: 0 0 0 1px #c8d6e2; margin: 2px 0 0 5px; z-index: 1; }
.timeline .mark.red { background: #d93025; } .timeline .mark.yellow { background: #e0a800; } .timeline .mark.green { background: #2e9e57; } .timeline .mark.gray { background: #9aa8b5; }
.timeline .body b { display: block; font-size: 15px; }
.timeline .body span { font-size: 13.5px; color: var(--muted); }

/* ---------- Pasos ---------- */
.steps { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.step .n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #c8d6e2; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.step.on { color: var(--text); font-weight: 700; }
.step.on .n { border-color: var(--primary); background: var(--primary); color: #fff; }
.step.done .n { border-color: #2e9e57; background: #2e9e57; color: #fff; }
.step-sep { flex: 0 0 40px; height: 2px; background: #dbe4ec; align-self: center; }

/* ---------- QR / etiqueta ---------- */
.qr-box { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.qr-box svg { border: 1px solid var(--border); border-radius: 6px; }
.label-print { border: 2px dashed #9fb3c6; border-radius: 8px; padding: 14px; display: inline-flex; gap: 16px; align-items: center; background: #fff; }
.label-print .code { font-size: 20px; font-weight: 700; letter-spacing: .5px; }

/* ---------- Fotos ---------- */
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.thumbs img { width: 110px; height: 82px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

/* ---------- Firma ---------- */
.signature { border: 1px dashed #9fb3c6; border-radius: 8px; background: #fff; touch-action: none; cursor: crosshair; width: 100%; max-width: 460px; height: 150px; display: block; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); font-weight: 700; border-bottom-color: var(--primary); }

/* ---------- Modal y toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(15, 30, 45, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 19px; margin-bottom: 10px; }
.modal .form-actions { justify-content: flex-end; }
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 60; }
.toast { background: var(--sidebar); color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 380px; animation: tin .2s ease-out; }
.toast.error { background: #a3241c; } .toast.ok { background: #1f6b3a; } .toast.warn { background: #8a6400; }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Login ---------- */
.login { display: flex; min-height: 100vh; }
.login-side { width: 500px; flex-shrink: 0; background: #14304b; color: #fff; padding: 110px 60px 40px; }
.login-side h1 { color: #fff; font-size: 32px; letter-spacing: .5px; }
.login-side .sub { color: #afc3d5; font-size: 19px; margin-top: 6px; padding-bottom: 36px; border-bottom: 1px solid #2b4a66; }
.login-side .feat { margin-top: 44px; }
.login-side .feat b { display: block; font-size: 21px; margin-bottom: 6px; }
.login-side .feat span { color: #c4d3e1; font-size: 14px; }
.login-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
.login-card { width: 100%; max-width: 560px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 26px 24px; }
.login-card h2 { font-size: 18px; }
.demo-users { width: 100%; max-width: 560px; margin-top: 22px; }
.demo-users table { font-size: 13px; }
.demo-users td, .demo-users th { padding: 7px 8px; }

/* ---------- Informe ---------- */
.report h2 { font-size: 17px; border-bottom: 2px solid var(--sidebar); padding-bottom: 6px; margin: 26px 0 12px; }
.report h3 { font-size: 15px; margin: 18px 0 8px; }
.report .tbl { font-size: 13px; }
.report-head { display: flex; justify-content: space-between; gap: 20px; border-bottom: 3px solid var(--sidebar); padding-bottom: 14px; }
.report-head h1 { font-size: 22px; }

/* ---------- Responsivo ---------- */
@media (max-width: 1000px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .login-side { display: none; }
}
@media (max-width: 760px) {
  .sidebar { position: fixed; left: -260px; z-index: 40; transition: left .2s; }
  .sidebar.open { left: 0; }
  .menu-toggle { display: block; }
  .topbar { padding: 0 16px; }
  .topbar .sys { display: none; }
  .content { padding: 22px 16px 30px; }
  .grid-2, .grid-3, .grid-4, .fields, .fields.three, .form-grid { grid-template-columns: 1fr; }
  .page-title { font-size: 24px; }
  .item { flex-direction: column; align-items: flex-start; }
}

/* ---------- Impresión ---------- */
@media print {
  .sidebar, .topbar, .no-print, .toasts, .footer-note { display: none !important; }
  body { background: #fff; font-size: 12px; }
  .content { padding: 0; max-width: none; }
  .card { border: 0; box-shadow: none; padding: 0; }
  .report h2 { break-after: avoid; }
  .tbl tr { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}

</style>

 *
 *   QR.svg('texto', 4)  -> cadena <svg> lista para insertar en la página

(function (global) {
  const ECC_PER_BLOCK = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26]; // nivel M
  const NUM_BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];             // nivel M

      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0

    let fallo = null, verificado = false;

      const v = ultimaVerificacion(f.id);
      if (v) verificado = true;
      if (v && !v.coincide) fallo = { f, v };
    });
    if (fallo) {
      const al = db.alertas.find(a => a.id_verificacion === fallo.v.id);
      return al && al.estado === 'Resuelta'
        ? { color: 'yellow', texto: 'No coincidente · alerta resuelta' }
        : { color: 'red', texto: 'Hash no coincidente' };

    return verificado ? { color: 'green', texto: 'Hash coincidente' } : { color: 'green', texto: 'Hash registrado' };

    const ev = db.evidencias.find(e => e.id === idEv);
    if (!ev || !ev.documento) throw new Error('La evidencia no es un documento físico.');
    if (!(can('EVD_CREAR', u) || can('CUS_GESTIONAR', u))) { requiere('EVD_CREAR', 'adjuntar documentos escaneados'); }
    if (ev.estado === 'Archivada') throw new Error('La evidencia está archivada.');
    const f = agregarArchivo(ev, a, u, true);
    ev.documento.digitalizado = true;
    ev.documento.fecha_digitalizacion = nowISO();
    log('Asoció documento escaneado', 'ARCHIVO', a.nombre, `Mismo registro ${ev.codigo} · hash ${a.hash.slice(0, 12)}…`, { inc: ev.id_incidente, ev: ev.id });
    save();
    return f;
  }

  // ---------------------------------------------------------------- Custodia y transferencias
  function entregarACustodio(idEv, idCustodio, motivo) {
    const u = requiere('EVD_CREAR', 'entregar evidencias al custodio');
    const ev = db.evidencias.find(e => e.id === idEv);
    if (ev.estado !== 'Registrada') throw new Error('La evidencia ya fue entregada al custodio.');
    if (ev.id_responsable !== u.id) throw new Error('Solo el responsable actual puede entregar la evidencia.');
    if (transferenciaPendiente(idEv)) throw new Error('Ya existe una entrega pendiente de recepción.');
    const rec = userById(+idCustodio);
    if (!rec || rec.estado !== 'Activo' || !can('CUS_GESTIONAR', rec)) throw new Error('Seleccione un custodio activo.');
    if (rec.id === u.id) throw new Error('Un usuario no puede transferirse una evidencia a sí mismo.');
    const tr = { id: nextId('transferencias'), codigo: nextCode('TR'), tipo: 'Entrega inicial', id_evidencia: ev.id, id_entrega: u.id, id_recibe: rec.id, id_autoriza: null, id_ubicacion_origen: ev.id_ubicacion, id_ubicacion_destino: null, motivo: motivo || 'Entrega al custodio después del registro', observacion: '', fecha_solicitud: nowISO(), fecha_autorizacion: null, fecha_recepcion: null, estado: 'Pendiente de recepción', firma: null };
    db.transferencias.push(tr);
    log('Entregó evidencia al custodio', 'TRANSFERENCIA', tr.codigo, `${nombre(u)} → ${nombre(rec)} · pendiente de confirmación`, { inc: ev.id_incidente, ev: ev.id });
    save();
    return tr;
  }

  function solicitarTraslado(idEv, idRecibe, idDestino, motivo) {
    const u = requiere('CUS_GESTIONAR', 'solicitar transferencias');
    obligatorio({ idRecibe, idDestino, motivo }, [['idRecibe', 'Recibe'], ['idDestino', 'Destino'], ['motivo', 'Motivo']]);
    const ev = db.evidencias.find(e => e.id === idEv);
    if (ev.estado === 'Archivada') throw new Error('La evidencia está archivada.');
    if (ev.estado === 'Registrada') throw new Error('La evidencia aún no ha sido recibida por un custodio.');
    if (ev.id_responsable !== u.id) throw new Error('Solo el responsable actual puede entregar la evidencia.');
    if (+idRecibe === u.id) throw new Error('Un usuario no puede transferirse una evidencia a sí mismo.');
    if (transferenciaPendiente(idEv)) throw new Error('Existe otra transferencia pendiente de recepción para esta evidencia.');
    if (+idDestino === ev.id_ubicacion && +idRecibe === ev.id_responsable) throw new Error('El destino y el receptor son iguales a los actuales.');
    const rec = userById(+idRecibe);
    if (!rec || rec.estado !== 'Activo') throw new Error('El receptor debe ser un usuario activo.');
    const tr = { id: nextId('transferencias'), codigo: nextCode('TR'), tipo: 'Traslado', id_evidencia: ev.id, id_entrega: u.id, id_recibe: rec.id, id_autoriza: null, id_ubicacion_origen: ev.id_ubicacion, id_ubicacion_destino: +idDestino, motivo: motivo.trim(), observacion: '', fecha_solicitud: nowISO(), fecha_autorizacion: null, fecha_recepcion: null, estado: 'Pendiente de autorización', firma: null };
    db.transferencias.push(tr);
    log('Solicitó transferencia', 'TRANSFERENCIA', tr.codigo, `${nombre(u)} → ${nombre(rec)} · ${ubicName(+idDestino)} · ${tr.motivo}`, { inc: ev.id_incidente, ev: ev.id });
    save();
    return tr;
  }

  function decidirTraslado(idTr, aprobar, observacion) {
    requiere('TRF_AUTORIZAR', 'autorizar transferencias');
    const tr = db.transferencias.find(t => t.id === idTr);
    if (tr.estado !== 'Pendiente de autorización') throw new Error('La transferencia no está pendiente de autorización.');
    if (!aprobar && !String(observacion || '').trim()) throw new Error('Indique el motivo del rechazo.');
    const u = me();
    const ev = db.evidencias.find(e => e.id === tr.id_evidencia);
    tr.id_autoriza = u.id; tr.fecha_autorizacion = nowISO(); tr.observacion = (observacion || '').trim();
    tr.estado = aprobar ? 'Pendiente de recepción' : 'Rechazada';
    log(aprobar ? 'Autorizó transferencia' : 'Rechazó transferencia', 'TRANSFERENCIA', tr.codigo, tr.observacion || (aprobar ? 'Habilita la recepción' : ''), { inc: ev.id_incidente, ev: ev.id });
    save();
  }

  function confirmarRecepcion(idTr, datos) {
    const u = requiere('CUS_GESTIONAR', 'confirmar recepciones');
    const tr = db.transferencias.find(t => t.id === idTr);
    const ev = db.evidencias.find(e => e.id === tr.id_evidencia);
    if (tr.id_recibe !== u.id) throw new Error('Solo el receptor designado puede confirmar la recepción.');
    if (tr.estado === 'Pendiente de autorización') throw new Error('La transferencia aún no ha sido autorizada por el supervisor; no puede confirmarse.');
    if (tr.estado !== 'Pendiente de recepción') throw new Error('La transferencia no está pendiente de recepción.');
    if (!datos.codigoOk || !datos.embalajeOk) throw new Error('Confirme la revisión del código y del embalaje, o reporte una inconsistencia.');
    if (!datos.firma) throw new Error('Registre la firma de recepción.');
    const destino = tr.id_ubicacion_destino || +datos.id_ubicacion;
    if (!destino) throw new Error('Seleccione la ubicación de almacenamiento.');
    tr.id_ubicacion_destino = destino;
    tr.fecha_recepcion = nowISO();
    tr.estado = 'Completada';
    tr.firma = datos.firma;
    tr.firma_nombre = nombre(u);
    // el responsable y la ubicación cambian solo al confirmar
    ev.id_responsable = u.id;
    ev.id_ubicacion = destino;
    if (ev.estado === 'Registrada') ev.estado = 'Almacenada';
    log('Confirmó recepción', 'TRANSFERENCIA', tr.codigo, `Responsable: ${nombre(u)} · Ubicación: ${ubicName(destino)} · firma electrónica simulada`, { inc: ev.id_incidente, ev: ev.id });
    save();
  }

  function reportarInconsistencia(idTr, detalle) {
    const u = requiere('CUS_GESTIONAR', 'reportar inconsistencias de recepción');
    const tr = db.transferencias.find(t => t.id === idTr);
    const ev = db.evidencias.find(e => e.id === tr.id_evidencia);
    if (tr.id_recibe !== u.id) throw new Error('Solo el receptor designado puede reportar la recepción.');
    if (tr.estado !== 'Pendiente de recepción') throw new Error('La transferencia no está pendiente de recepción.');
    if (!String(detalle || '').trim()) throw new Error('Describa la inconsistencia encontrada.');
    tr.estado = 'Con inconsistencia';
    tr.observacion = detalle.trim();
    tr.fecha_recepcion = nowISO();
    const al = crearAlerta('Recepción', ev, `Inconsistencia al recibir ${tr.codigo}: ${detalle.trim()}`, null);
    log('Reportó inconsistencia de recepción', 'TRANSFERENCIA', tr.codigo, detalle.trim() + ' · ' + al.codigo, { inc: ev.id_incidente, ev: ev.id });
    save();
    return al;
  }

  // ---------------------------------------------------------------- Accesos y análisis
  function solicitarAcceso(idEv, motivo, inicio, fin) {
    const u = requiere('ACC_SOLICITAR', 'solicitar acceso');
    obligatorio({ idEv, motivo, inicio, fin }, [['idEv', 'Evidencia'], ['motivo', 'Motivo'], ['inicio', 'Inicio'], ['fin', 'Fin']]);
    const ev = db.evidencias.find(e => e.id === +idEv);
    if (!archivosDe(ev.id).length) throw new Error('La evidencia no tiene archivos digitales para generar una copia.');
    if (ev.estado === 'Archivada') throw new Error('La evidencia está archivada.');
    if (new Date(fin) <= new Date(inicio)) throw new Error('La fecha de fin debe ser posterior al inicio.');
    if (db.solicitudes.some(s => s.id_evidencia === ev.id && s.id_solicitante === u.id && ['Pendiente', 'Vigente', 'Programada'].includes(estadoAcceso(s))))
      throw new Error('Ya tiene una solicitud pendiente o vigente para esta evidencia.');
    const s = { id: nextId('solicitudes'), codigo: nextCode('SOL'), id_evidencia: ev.id, id_solicitante: u.id, motivo: motivo.trim(), fecha_solicitud: nowISO(), inicio: new Date(inicio).toISOString(), fin: new Date(fin).toISOString(), id_supervisor: null, decision: 'Pendiente', observacion: '', fecha_decision: null, fecha_finalizacion: null, id_copia: null };
    db.solicitudes.push(s);
    log('Solicitó acceso', 'SOLICITUD_ACCESO', s.codigo, `Copia de ${ev.codigo} · ${s.motivo}`, { inc: ev.id_incidente, ev: ev.id });
    save();
    return s;
  }

  function decidirAcceso(idSol, aprobar, observacion, inicio, fin) {
    const u = requiere('ACC_AUTORIZAR', 'aprobar o rechazar accesos');
    const s = db.solicitudes.find(x => x.id === idSol);
    if (s.decision !== 'Pendiente') throw new Error('La solicitud ya fue resuelta.');
    if (s.id_solicitante === u.id) throw new Error('Nadie puede aprobar su propia solicitud.');
    if (!aprobar && !String(observacion || '').trim()) throw new Error('Indique el motivo del rechazo.');
    const ev = db.evidencias.find(e => e.id === s.id_evidencia);
    const ini = inicio ? new Date(inicio) : new Date(s.inicio), f = fin ? new Date(fin) : new Date(s.fin);
    if (aprobar && (isNaN(ini) || isNaN(f) || f <= ini)) throw new Error('El periodo aprobado no es válido: el fin debe ser posterior al inicio.');
    if (aprobar && f <= new Date()) throw new Error('El periodo aprobado ya venció; ajuste la fecha de fin.');
    s.id_supervisor = u.id; s.fecha_decision = nowISO(); s.observacion = (observacion || '').trim();
    s.decision = aprobar ? 'Aprobada' : 'Rechazada';
    if (aprobar) {
      s.inicio = ini.toISOString();
      s.fin = f.toISOString();
      // se prepara una copia autorizada vinculada con su archivo de origen
      const origen = archivosDe(ev.id)[0];
      const codCopia = nextCode('COP');
      const copia = { id: nextId('archivos'), codigo: codCopia, id_evidencia: ev.id, nombre: `${codCopia}_${origen.nombre}`, extension: origen.extension, tamano: origen.tamano, tipo_archivo: 'Copia de trabajo autorizada', ruta_segura: `laboratorio://copias/${codCopia}/${origen.nombre}`, hash_original: origen.hash_original, algoritmo: 'SHA-256', es_copia: true, id_origen: origen.id, id_solicitud: s.id, fecha_registro: nowISO(), id_usuario: u.id, contenido_demo: origen.contenido_demo };
      db.archivos.push(copia);
      s.id_copia = copia.id;
      log('Aprobó acceso', 'SOLICITUD_ACCESO', s.codigo, `Copia ${codCopia} de ${origen.nombre} · periodo hasta ${new Date(s.fin).toLocaleString('es-GT')}${s.observacion ? ' · ' + s.observacion : ''}`, { inc: ev.id_incidente, ev: ev.id });
    } else {
      log('Rechazó acceso', 'SOLICITUD_ACCESO', s.codigo, s.observacion, { inc: ev.id_incidente, ev: ev.id });
    }
    save();
  }

  function finalizarAcceso(idSol) {
    const u = me();
    const s = db.solicitudes.find(x => x.id === idSol);
    if (s.id_solicitante !== u.id && !can('ACC_AUTORIZAR', u)) throw new Error('Solo el solicitante o el supervisor pueden finalizar el acceso.');
    if (s.decision !== 'Aprobada' || s.fecha_finalizacion) throw new Error('El acceso no está activo.');
    const an = db.analisis.find(a => a.id_solicitud === s.id && a.estado === 'Iniciado');
    if (an) throw new Error('Finalice o guarde el análisis antes de cerrar el acceso.');
    s.fecha_finalizacion = nowISO();
    const ev = db.evidencias.find(e => e.id === s.id_evidencia);
    log('Finalizó acceso', 'SOLICITUD_ACCESO', s.codigo, 'La copia de trabajo deja de estar disponible', { inc: ev.id_incidente, ev: ev.id });
    save();
  }

  function crearAlerta(tipo, ev, descripcion, idVer) {
    const al = { id: nextId('alertas'), codigo: nextCode('ALT'), tipo, id_verificacion: idVer, id_evidencia: ev.id, id_incidente: ev.id_incidente, descripcion, estado: 'Pendiente', id_supervisor: null, resolucion: '', fecha_generacion: nowISO(), fecha_revision: null, fecha_resolucion: null };
    db.alertas.push(al);
    log('Generó alerta', 'ALERTA', al.codigo, `${tipo}: ${descripcion}`, { inc: ev.id_incidente, ev: ev.id }, null);
    return al;
  }

  // Compara el hash calculado con el registrado inicialmente
  function verificarIntegridad(idArchivo, hashCalculado, nombreVerificado) {
    const u = requiere('INT_VERIFICAR', 'verificar integridad');
    const f = db.archivos.find(a => a.id === idArchivo);
    const ev = db.evidencias.find(e => e.id === f.id_evidencia);
    if (f.es_copia) {
      const s = db.solicitudes.find(x => x.id === f.id_solicitud);
      if (s.id_solicitante !== u.id && !can('ACC_AUTORIZAR', u)) throw new Error('La copia pertenece a otra solicitud de acceso.');
      if (s.id_solicitante === u.id && estadoAcceso(s) !== 'Vigente') throw new Error(`El acceso no está vigente (estado: ${estadoAcceso(s)}).`);
    }
    const coincide = hashCalculado === f.hash_original;
    const v = { id: nextId('verificaciones'), codigo: nextCode('VER'), id_archivo: f.id, id_usuario: u.id, hash_referencia: f.hash_original, hash_calculado: hashCalculado, coincide, fecha: nowISO(), archivo_verificado: nombreVerificado || f.nombre };
    db.verificaciones.push(v);
    log('Verificó integridad', 'VERIFICACION', v.codigo, `${f.nombre} · ${coincide ? 'coincidente' : 'NO coincidente'}`, { inc: ev.id_incidente, ev: ev.id });
    let alerta = null;
    if (!coincide) {
      alerta = crearAlerta('Integridad', ev, `El hash de ${f.nombre} no coincide con el registrado. Referencia ${f.hash_original.slice(0, 8)}…${f.hash_original.slice(-4)}, calculado ${hashCalculado.slice(0, 8)}…${hashCalculado.slice(-4)}.`, v.id);
      db.analisis.filter(a => a.id_archivo === f.id && a.estado === 'Iniciado').forEach(a => {
        a.estado = 'Suspendido';
        log('Suspendió análisis', 'ANALISIS_FORENSE', a.codigo, 'Hash de la copia no coincidente · ' + alerta.codigo, { inc: ev.id_incidente, ev: ev.id });
      });
    }
    save();
    return { verificacion: v, alerta };
  }

  function puedeAnalizar(s) {
    const copia = db.archivos.find(a => a.id === s.id_copia);
    const v = copia && ultimaVerificacion(copia.id);
    return { copia, verificacion: v, ok: !!(v && v.coincide && estadoAcceso(s) === 'Vigente') };
  }

  function guardarAnalisis(idSol, d, finalizar) {
    const u = requiere('ANA_REGISTRAR', 'registrar análisis');
    const s = db.solicitudes.find(x => x.id === idSol);
    if (s.id_solicitante !== u.id) throw new Error('Solo el analista solicitante puede registrar el análisis de esta copia.');
    if (estadoAcceso(s) !== 'Vigente') throw new Error(`El acceso no está vigente (estado: ${estadoAcceso(s)}).`);
    const p = puedeAnalizar(s);
    if (!p.ok) throw new Error('Verifique primero la integridad de la copia autorizada; el hash debe coincidir.');
    obligatorio(d, [['procedimiento', 'Procedimiento']]);
    if (finalizar) obligatorio(d, [['resultado', 'Resultados'], ['conclusion', 'Conclusiones']]);
    const ev = db.evidencias.find(e => e.id === s.id_evidencia);
    let an = db.analisis.find(a => a.id_solicitud === s.id && a.estado !== 'Finalizado');
    if (!an) {
      an = { id: nextId('analisis'), codigo: nextCode('AN'), id_evidencia: ev.id, id_analista: u.id, id_solicitud: s.id, id_archivo: p.copia.id, procedimiento: '', resultado: '', conclusion: '', fecha_inicio: nowISO(), fecha_fin: null, estado: 'Iniciado' };
      db.analisis.push(an);
    }
    an.procedimiento = d.procedimiento.trim(); an.resultado = (d.resultado || '').trim(); an.conclusion = (d.conclusion || '').trim();
    an.estado = finalizar ? 'Finalizado' : 'Iniciado';
    if (finalizar) an.fecha_fin = nowISO();
    log(finalizar ? 'Finalizó análisis' : 'Guardó análisis', 'ANALISIS_FORENSE', an.codigo, `Sobre ${p.copia.nombre}`, { inc: ev.id_incidente, ev: ev.id });
    save();
    return an;
  }

  // Intento de abrir el archivo original de una evidencia
  function abrirOriginal(idArchivo) {
    const u = me();
    const f = db.archivos.find(a => a.id === idArchivo);
    const ev = db.evidencias.find(e => e.id === f.id_evidencia);
    if (ev.id_responsable === u.id && can('CUS_GESTIONAR', u)) {
      log('Consultó archivo original', 'ARCHIVO', f.nombre, 'Consulta controlada del custodio responsable', { inc: ev.id_incidente, ev: ev.id });
      save();
      return { permitido: true };
    }
    log('Acceso denegado', 'ARCHIVO', f.nombre, `${nombre(u)} (${rolDe(u).nombre}) intentó abrir el archivo original`, { inc: ev.id_incidente, ev: ev.id });
    const al = crearAlerta('Seguridad', ev, `${nombre(u)} (${rolDe(u).nombre}) intentó abrir el archivo original ${f.nombre}. El acceso fue bloqueado.`, null);
    save();
    return { permitido: false, alerta: al };
  }

  // ---------------------------------------------------------------- Alertas
  function revisarAlerta(id) {
    const u = requiere('ALE_RESOLVER', 'revisar alertas');
    const al = db.alertas.find(a => a.id === id);
    if (al.estado !== 'Pendiente') throw new Error('La alerta ya está en revisión o resuelta.');
    al.estado = 'En revisión'; al.id_supervisor = u.id; al.fecha_revision = nowISO();
    log('Marcó alerta en revisión', 'ALERTA', al.codigo, '', { inc: al.id_incidente, ev: al.id_evidencia });
    save();
  }
  function resolverAlerta(id, resolucion) {
    const u = requiere('ALE_RESOLVER', 'resolver alertas');
    const al = db.alertas.find(a => a.id === id);
    if (al.estado === 'Resuelta') throw new Error('La alerta ya fue resuelta.');
    if (!String(resolucion || '').trim() || resolucion.trim().length < 10) throw new Error('Documente la revisión y las medidas adoptadas (mínimo 10 caracteres).');
    al.estado = 'Resuelta'; al.id_supervisor = u.id; al.resolucion = resolucion.trim(); al.fecha_resolucion = nowISO();
    if (!al.fecha_revision) al.fecha_revision = al.fecha_resolucion;
    log('Resolvió alerta', 'ALERTA', al.codigo, al.resolucion, { inc: al.id_incidente, ev: al.id_evidencia });
    save();
  }

  // ---------------------------------------------------------------- Cierre
  function checksCierre(idInc) {
    const inc = db.incidentes.find(i => i.id === idInc);
    const evs = db.evidencias.filter(e => e.id_incidente === idInc);
    const ids = evs.map(e => e.id);
    const cod = (idEv) => db.evidencias.find(e => e.id === idEv).codigo;
    const trs = db.transferencias.filter(t => ids.includes(t.id_evidencia) && (t.estado === 'Pendiente de autorización' || t.estado === 'Pendiente de recepción'));
    const sols = db.solicitudes.filter(s => ids.includes(s.id_evidencia) && ['Pendiente', 'Vigente', 'Programada'].includes(estadoAcceso(s)));
    const als = db.alertas.filter(a => a.id_incidente === idInc && a.estado !== 'Resuelta');
    const sinCustodia = evs.filter(e => e.estado === 'Registrada');
    const ans = db.analisis.filter(a => ids.includes(a.id_evidencia) && a.estado !== 'Finalizado');
    const docs = evs.filter(e => e.documento && !e.documento.digitalizado);
    return [
      { nombre: 'Evidencias registradas', ok: evs.length > 0, detalle: evs.length ? [] : ['El caso no tiene evidencias registradas.'] },
      { nombre: 'Transferencias completadas', ok: !trs.length, detalle: trs.map(t => `${t.codigo} · ${cod(t.id_evidencia)} · ${t.estado}`) },
      { nombre: 'Solicitudes y accesos finalizados', ok: !sols.length, detalle: sols.map(s => `${s.codigo} · ${cod(s.id_evidencia)} · ${estadoAcceso(s)}`) },
      { nombre: 'Alertas resueltas', ok: !als.length, detalle: als.map(a => `${a.codigo} · ${a.tipo} · ${a.estado}`) },
      { nombre: 'Responsables y ubicaciones registrados', ok: !sinCustodia.length, detalle: sinCustodia.map(e => `${e.codigo} · aún no entregada al custodio`) },
      { nombre: 'Análisis requeridos finalizados', ok: !ans.length, detalle: ans.map(a => `${a.codigo} · ${cod(a.id_evidencia)} · ${a.estado}`) },
      { nombre: 'Documentos físicos digitalizados', ok: !docs.length, detalle: docs.map(e => `${e.codigo} · pendiente: ${e.documento.motivo_pendiente}`), aviso: true }
    ].map(c => Object.assign(c, { inc }));
  }
  function puedeCerrar(idInc) {
    return checksCierre(idInc).every(c => c.ok || c.aviso);
  }
  function cerrarCaso(idInc, comentario) {
    const u = requiere('CAS_CERRAR', 'autorizar el cierre de casos');
    const inc = db.incidentes.find(i => i.id === idInc);
    if (inc.estado === 'Cerrado' || inc.estado === 'Archivado') throw new Error('El caso ya fue cerrado.');
    const pend = checksCierre(idInc).filter(c => !c.ok && !c.aviso);
    if (pend.length) {
      log('Cierre bloqueado', 'INCIDENTE', inc.codigo, 'Pendientes: ' + pend.map(p => p.nombre).join(', '), { inc: inc.id });
      save();
      throw new Error('El cierre está bloqueado: ' + pend.map(p => p.nombre.toLowerCase()).join(', ') + '.');
    }
    inc.estado = 'Cerrado'; inc.id_supervisor_cierre = u.id; inc.fecha_cierre = nowISO(); inc.comentario_cierre = (comentario || '').trim();
    log('Autorizó cierre del caso', 'INCIDENTE', inc.codigo, inc.comentario_cierre || 'Sin asuntos pendientes', { inc: inc.id });
    save();
  }
  function archivarCaso(idInc) {
    requiere('CAS_CERRAR', 'archivar casos');
    const inc = db.incidentes.find(i => i.id === idInc);
    if (inc.estado !== 'Cerrado') throw new Error('Solo pueden archivarse casos cerrados.');
    inc.estado = 'Archivado'; inc.fecha_archivo = nowISO();
    db.evidencias.filter(e => e.id_incidente === idInc).forEach(e => { e.estado = 'Archivada'; });
    log('Archivó caso', 'INCIDENTE', inc.codigo, 'La información se conserva para consultas y auditorías', { inc: inc.id });
    save();
  }
  function intentarEliminarEvidencia(idEv) {
    const ev = db.evidencias.find(e => e.id === idEv);
    log('Eliminación rechazada', 'EVIDENCIA', ev.codigo, 'Las evidencias no se eliminan; solo cambian de estado', { inc: ev.id_incidente, ev: ev.id });
    save();
    throw new Error('Una evidencia registrada no puede eliminarse; únicamente puede cambiar de estado.');
  }

  function generarInforme(idInc) {
    const u = requiere('INF_GENERAR', 'generar informes');
    const inc = db.incidentes.find(i => i.id === idInc);
    const inf = { id: nextId('informes'), codigo: nextCode('INF'), id_incidente: idInc, id_usuario: u.id, tipo: inc.estado === 'Cerrado' || inc.estado === 'Archivado' ? 'Cierre' : 'Cadena de custodia', fecha: nowISO() };
    db.informes.push(inf);
    log('Generó informe', 'INFORME_TRAZABILIDAD', inf.codigo, `${inf.tipo} · ${inc.codigo}`, { inc: idInc });
    save();
    return inf;
  }

  // ---------------------------------------------------------------- Administración
  function guardarUsuario(d) {
    requiere('ADM_GESTIONAR', 'administrar usuarios');
    obligatorio(d, [['nombres', 'Nombres'], ['apellidos', 'Apellidos'], ['correo', 'Correo'], ['id_rol', 'Rol']]);
    const correo = d.correo.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) throw new Error('El correo no tiene un formato válido.');
    if (db.usuarios.some(u => u.correo === correo && u.id !== d.id)) throw new Error('Ya existe un usuario con ese correo.');
    if (d.id) {
      const u = userById(d.id);
      const antes = `${nombre(u)} · ${rolDe(u).nombre}`;
      u.nombres = d.nombres.trim(); u.apellidos = d.apellidos.trim(); u.correo = correo; u.id_rol = +d.id_rol;
      if (d.clave) { if (d.clave.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.'); u.sal = randomSalt(); u.clave_hash = hashClave(u.sal, d.clave); }
      log('Modificó usuario', 'USUARIO', correo, `${antes} → ${nombre(u)} · ${rolDe(u).nombre}`);
      save();
      return u;
    }
    if (!d.clave || d.clave.length < 8) throw new Error('La contraseña temporal debe tener al menos 8 caracteres.');
    const sal = randomSalt();
    const u = { id: nextId('usuarios'), nombres: d.nombres.trim(), apellidos: d.apellidos.trim(), correo, id_rol: +d.id_rol, sal, clave_hash: hashClave(sal, d.clave), estado: 'Activo', intentos: 0, fecha_creacion: nowISO(), ultimo_acceso: null };
    db.usuarios.push(u);
    log('Creó usuario', 'USUARIO', correo, `${nombre(u)} · ${rolDe(u).nombre}`);
    save();
    return u;
  }
  function cambiarEstadoUsuario(id, estado) {
    const adm = requiere('ADM_GESTIONAR', 'activar o desactivar usuarios');
    const u = userById(id);
    if (u.id === adm.id && estado !== 'Activo') throw new Error('No puede desactivar su propia cuenta.');
    u.estado = estado;
    if (estado === 'Activo') u.intentos = 0;
    log(estado === 'Activo' ? 'Activó usuario' : 'Desactivó usuario', 'USUARIO', u.correo, 'El historial del usuario se conserva');
    save();
  }
  function permisoEditable(id_rol, codigo) {
    const p = PERMISOS.find(x => x.codigo === codigo);
    if (p.fijo) return { editable: false, motivo: `Exclusivo de ${p.fijo.map(r => ROLES.find(x => x.id_rol === r).nombre).join(', ')}` };
    if (id_rol === 6 && p.escritura) return { editable: false, motivo: 'El auditor solo consulta' };
    if (codigo === 'AUD_CONSULTAR' && id_rol !== 6) return { editable: true };
    return { editable: true };
  }
  function setPermiso(id_rol, codigo, activo) {
    requiere('ADM_GESTIONAR', 'asignar permisos');
    const e = permisoEditable(id_rol, codigo);
    if (!e.editable) throw new Error(e.motivo);
    const i = db.rol_permiso.findIndex(rp => rp.id_rol === id_rol && rp.codigo === codigo);
    if (activo && i < 0) db.rol_permiso.push({ id_rol, codigo });
    if (!activo && i >= 0) db.rol_permiso.splice(i, 1);
    log(activo ? 'Asignó permiso' : 'Retiró permiso', 'ROL_PERMISO', codigo, ROLES.find(r => r.id_rol === id_rol).nombre);
    save();
  }
  function guardarCatalogo(tabla, d) {
    requiere('ADM_GESTIONAR', 'administrar catálogos');
    obligatorio(d, [['nombre', 'Nombre']]);
    if (db[tabla].some(x => x.nombre.toLowerCase() === d.nombre.trim().toLowerCase())) throw new Error('Ya existe un registro con ese nombre.');
    const r = Object.assign({ id: nextId(tabla), estado: true }, d, { nombre: d.nombre.trim() });
    db[tabla].push(r);
    log('Agregó registro de catálogo', tabla === 'tipos' ? 'TIPO_EVIDENCIA' : 'UBICACION', r.nombre, r.descripcion || '');
    save();
  }
  function toggleCatalogo(tabla, id) {
    requiere('ADM_GESTIONAR', 'administrar catálogos');
    const r = db[tabla].find(x => x.id === id);
    r.estado = !r.estado;
    log(r.estado ? 'Activó registro de catálogo' : 'Desactivó registro de catálogo', tabla === 'tipos' ? 'TIPO_EVIDENCIA' : 'UBICACION', r.nombre, '');
    save();
  }

  function guardarPrueba(codigo, d) {
    db.pruebas[codigo] = Object.assign({}, d, { fecha: nowISO(), responsable: nombre(me()) });
    save();
  }

  function reset() {
    localStorage.removeItem(DB_KEY);
    localStorage.removeItem(SESSION_KEY);
    load();
  }

  load();

  global.Store = {
    get db() { return db; },
    CLAVE_DEMO, ROLES, PERMISOS, MEDIOS, TIPOS_INCIDENTE, PRIORIDADES, DEMO,
    load, save, reset, me, can, canAny, rolDe, nombre, userById, userName, ubicName, tipoDe, incDe, archivosDe,
    login, logout, denegarModulo, log,
    estadoAcceso, estadoEvidencia, integridad, semaforo, transferenciaPendiente, ultimaVerificacion, alertasAbiertas,
    evidenciasVisibles, incidentesVisibles,
    crearIncidente, crearEvidencia, adjuntarEscaneo, entregarACustodio, solicitarTraslado, decidirTraslado,
    confirmarRecepcion, reportarInconsistencia, solicitarAcceso, decidirAcceso, finalizarAcceso,
    verificarIntegridad, puedeAnalizar, guardarAnalisis, abrirOriginal, revisarAlerta, resolverAlerta,
    checksCierre, puedeCerrar, cerrarCaso, archivarCaso, intentarEliminarEvidencia, generarInforme,
    guardarUsuario, cambiarEstadoUsuario, permisoEditable, setPermiso, guardarCatalogo, toggleCatalogo,
    verificarBitacora, guardarPrueba
  };
})(window);

</script>
<script>
/*
 * Componentes de interfaz compartidos: menú lateral según rol, encabezado,
 * control de acceso a cada pantalla y utilidades de formato.
 */
(function (global) {
  const S = global.Store;

  const NAV = [
    { href: 'inicio.html', label: 'Inicio', perms: null },
    { href: 'incidentes.html', label: 'Incidentes', perms: ['INC_VER', 'INC_CREAR'] },
    { href: 'evidencias.html', label: 'Evidencias', perms: ['EVD_VER', 'EVD_CREAR'] },
    { href: 'custodia.html', label: 'Custodia', perms: ['CUS_VER', 'CUS_GESTIONAR', 'TRF_AUTORIZAR'], count: pendCustodia },
    { href: 'solicitudes.html', label: 'Solicitudes', perms: ['ACC_SOLICITAR', 'ACC_AUTORIZAR', 'AUD_CONSULTAR'], count: pendSolicitudes },
    { href: 'analisis.html', label: 'Análisis', perms: ['ANA_REGISTRAR', 'AUD_CONSULTAR'] },
    { href: 'alertas.html', label: 'Alertas', perms: ['ALE_VER', 'ALE_RESOLVER'], count: () => S.db.alertas.filter(a => a.estado !== 'Resuelta').length },
    { href: 'seguimiento.html', label: 'Seguimiento', perms: ['SEG_VER'] },
    { href: 'bitacora.html', label: 'Bitácora', perms: ['BIT_VER'] },
    { href: 'informe.html', label: 'Informes', perms: ['INF_GENERAR'] },
    { href: 'cierre.html', label: 'Cierre', perms: ['CAS_CERRAR'] },
    { href: 'admin.html', label: 'Administración', perms: ['ADM_GESTIONAR'] }
  ];

  function pendCustodia() {
    const u = S.me();
    return S.db.transferencias.filter(t =>
      (t.estado === 'Pendiente de recepción' && t.id_recibe === u.id) ||
      (t.estado === 'Pendiente de autorización' && S.can('TRF_AUTORIZAR'))).length;
  }
  function pendSolicitudes() {
    return S.can('ACC_AUTORIZAR') ? S.db.solicitudes.filter(s => s.decision === 'Pendiente').length : 0;
  }

  // ---------------------------------------------------------------- Formato
  const esc = (v) => String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const pad = (n) => String(n).padStart(2, '0');
  function fmt(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; }
  function fmtTime(iso) { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function toLocalInput(d) {
    d = d ? new Date(d) : new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  const shortHash = (h) => h ? `${h.slice(0, 8)}…${h.slice(-6)}` : '—';

  const COLORS = {
    'Abierto': 'blue', 'En investigación': 'yellow', 'Cerrado': 'green', 'Archivado': 'gray',
    'Registrada': 'yellow', 'Almacenada': 'green', 'Archivada': 'gray', 'En análisis': 'yellow',
    'Pendiente de autorización': 'yellow', 'Pendiente de recepción': 'yellow', 'Completada': 'green', 'Rechazada': 'red', 'Con inconsistencia': 'red',
    'Pendiente': 'yellow', 'Aprobada': 'green', 'Vigente': 'blue', 'Programada': 'blue', 'Vencida': 'gray', 'Finalizada': 'gray',
    'En revisión': 'blue', 'Resuelta': 'green', 'Iniciado': 'blue', 'Suspendido': 'red', 'Finalizado': 'green',
    'Activo': 'green', 'Inactivo': 'gray', 'Bloqueado': 'red',
    'Baja': 'gray', 'Media': 'blue', 'Alta': 'yellow', 'Crítica': 'red'
  };
  const badge = (txt, color) => `<span class="badge ${color || COLORS[txt] || 'gray'}">${esc(txt)}</span>`;
  const sem = (ev) => { const s = S.semaforo(ev); return `<span class="badge ${s.color}"><span class="dot ${s.color}"></span>${esc(s.texto)}</span>`; };

  function param(name) { return new URLSearchParams(UI.__query()).get(name); }
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  // ---------------------------------------------------------------- Mensajes
  function toast(msg, type) {
    let box = $('.toasts');
    if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
    const t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), type === 'error' ? 6500 : 4000);
  }
  // Muestra un mensaje en la siguiente página (después de redirigir)
  function flash(msg, type) { sessionStorage.setItem('custodia_flash', JSON.stringify({ msg, type })); }
  function go(url, msg, type) { if (msg) flash(msg, type); UI.nav(url); }

  function modal(html, onMount) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    $$('[data-close]', back).forEach(b => b.addEventListener('click', close));
    if (onMount) onMount(back.querySelector('.modal'), close);
    return close;
  }
  function confirmar(titulo, texto, okLabel, danger) {
    return new Promise(resolve => {
      modal(`<h2>${esc(titulo)}</h2><p class="muted">${texto}</p>
        <div class="form-actions"><button class="btn" data-close>Cancelar</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" id="m-ok">${esc(okLabel || 'Confirmar')}</button></div>`,
      (m, close) => {
        $('#m-ok', m).onclick = () => { close(); resolve(true); };
        $$('[data-close]', m).forEach(b => b.addEventListener('click', () => resolve(false)));
      });
    });
  }
  function pedirTexto(titulo, texto, label, okLabel, danger) {
    return new Promise(resolve => {
      modal(`<h2>${esc(titulo)}</h2><p class="muted">${texto}</p>
        <label class="lbl">${esc(label)} <span class="req">*</span></label><textarea id="m-txt"></textarea>
        <div class="form-actions"><button class="btn" data-close>Cancelar</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" id="m-ok">${esc(okLabel || 'Aceptar')}</button></div>`,
      (m, close) => {
        $('#m-txt', m).focus();
        $('#m-ok', m).onclick = () => { const v = $('#m-txt', m).value; close(); resolve(v); };
        $$('[data-close]', m).forEach(b => b.addEventListener('click', () => resolve(null)));
      });
    });
  }

  // Ejecuta una operación del Store mostrando el error si la regla lo impide
  function intentar(fn, okMsg) {
    try {
      const r = fn();
      if (okMsg) toast(okMsg, 'ok');
      return r === undefined ? true : r;
    } catch (e) {
      toast(e.message, 'error');
      if (e.campos) marcarInvalidos(e.campos);
      return false;
    }
  }
  function marcarInvalidos(campos) {
    $$('.invalid').forEach(x => x.classList.remove('invalid'));
    campos.forEach(c => { const el = document.querySelector(`[name="${c}"]`); if (el) el.classList.add('invalid'); });
    const first = document.querySelector('.invalid');
    if (first) first.focus();
  }
  function formData(form) {
    const o = {};
    new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v : v; });
    return o;
  }

  const opts = (list, val, label, value, empty) =>
    (empty ? `<option value="">${esc(empty)}</option>` : '') +
    list.map(x => {
      const v = value ? value(x) : x, l = label ? label(x) : x;
      return `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`;
    }).join('');

  // Botón deshabilitado que explica la regla que lo bloquea
  const lockedBtn = (label, motivo) => `<button class="btn disabled" type="button" title="${esc(motivo)}" onclick="UI.toast(${esc(JSON.stringify(motivo))}, 'warn')">${esc(label)}</button>`;

  // ---------------------------------------------------------------- Layout
  function layout(active) {
    const u = S.me();
    const rol = S.rolDe(u);
    const items = NAV.filter(n => S.canAny(n.perms, u)).map(n => {
      const c = n.count ? n.count() : 0;
      return `<a href="${n.href}" class="${n.href === active ? 'active' : ''}"><span>${n.label}</span>${c ? `<span class="count">${c}</span>` : ''}</a>`;
    }).join('');
    const ini = (u.nombres[0] + u.apellidos[0]).toUpperCase();
    document.body.innerHTML = `
      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <a class="brand" href="inicio.html"><div class="brand-logo">C</div><div><div class="brand-name">CUSTODIA</div><div class="brand-sub">Evidencia digital</div></div></a>
          <div class="nav-title">Espacio de trabajo</div>
          <nav class="nav">${items}</nav>
          <div class="sidebar-foot">
            <button type="button" id="btn-reset">Restablecer datos</button></div>
        </aside>
        <div class="main">
          <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Menú">☰</button>
            <div class="sys"><b>Sistema de Cadena de Custodia</b></div>
            <div class="userbox">
              <div class="who" style="text-align:right"><b>${esc(S.nombre(u))}</b><span>${esc(rol.nombre)}</span></div>
              <div class="avatar">${esc(ini)}</div>
              <button class="btn sm" id="btn-logout">Salir</button>
            </div>
          </header>
          <main class="content" id="app"></main>
        </div>
      </div>`;
    $('#btn-logout').onclick = () => { S.logout(); UI.nav('index.html'); };
    $('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');
    $('#btn-reset').onclick = async () => {
      if (await confirmar('Restablecer datos', 'Se borrarán los registros creados y se restaurarán los datos iniciales. Se cerrará la sesión.', 'Restablecer', true)) {
        S.reset(); UI.nav('index.html');
      }
    };
    return $('#app');
  }

  function header(eyebrow, title, sub, actions) {
    return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="page-title">${esc(title)}</h1></div>
      ${actions ? `<div class="btn-row no-print">${actions}</div>` : ''}</div>
      <p class="page-sub">${sub || ''}</p>`;
  }
  const footer = () => '';

  /**
   * Inicializa una pantalla protegida.
   * opciones: { active: 'archivo.html', perms: [...], modulo: 'Nombre', render(app) }
   */
  function page(o) {
    UI_onReady(() => {
      const u = S.me();
      if (!u) {
        UI.nav('index.html?next=' + encodeURIComponent(UI.current()));
        return;
      }
      const app = layout(o.active);
      if (o.perms && !S.canAny(o.perms, u)) {
        S.denegarModulo(o.modulo || o.active);
        app.innerHTML = header('Acceso restringido', 'Acceso denegado', '') +
          `<div class="alert error"><b>Su rol (${esc(S.rolDe(u).nombre)}) no tiene permiso para abrir el módulo “${esc(o.modulo || o.active)}”.</b>
          El intento quedó registrado en la bitácora.</div>
          <a class="btn" href="inicio.html">Volver al inicio</a>`;
        return;
      }
      try {
        o.render(app, u);
      } catch (e) {
        console.error(e);
        app.innerHTML = `<div class="alert error"><b>No fue posible mostrar la pantalla.</b>${esc(e.message)}</div><a class="btn" href="inicio.html">Volver al inicio</a>`;
      }
      const f = sessionStorage.getItem('custodia_flash');
      if (f) { sessionStorage.removeItem('custodia_flash'); const { msg, type } = JSON.parse(f); toast(msg, type); }
    });
  }

  function notFound(app, what) {
    app.innerHTML = `<div class="alert warn"><b>${esc(what)} no encontrado.</b>Verifique el enlace o vuelva a la lista.</div><a class="btn" href="inicio.html">Volver al inicio</a>`;
  }

  // Selector de archivo que calcula el SHA-256 en el navegador
  async function hashFiles(fileList) {
    const out = [];
    for (const f of Array.from(fileList)) {
      const hash = await sha256File(f);
      out.push({ nombre: f.name, tamano: f.size, hash, tipo_archivo: f.type || 'Archivo digital' });
    }
    return out;
  }
  // Archivo de prueba (idéntico o modificado) a partir del contenido registrado
  function demoContenido(contenido, modificado) {
    return modificado ? contenido.replace(/\n$/, '') + ' [modificado]\n' : contenido;
  }
  function demoHash(contenido, modificado) { return sha256(demoContenido(contenido, modificado)); }

  /**
   * Diálogo para verificar la integridad de un archivo: el usuario selecciona
   * el archivo (o una copia de prueba) y se compara su SHA-256 con el registrado.
   */
  function dialogoVerificacion(archivo, onDone) {
    const S = global.Store;
    const demo = archivo.contenido_demo;
    modal(`<h2>Verificar integridad</h2>
      <p class="muted small">Archivo de referencia: <b>${esc(archivo.nombre)}</b><br>Hash registrado: <code>${esc(archivo.hash_original)}</code></p>
      <label class="lbl">Seleccione el archivo que desea comprobar</label>
      <input type="file" id="v-file">
      ${demo ? `<p class="note">O utilice un archivo de prueba:</p>
        <div class="btn-row"><button class="btn sm" id="v-ok">Copia idéntica (prueba)</button><button class="btn sm danger" id="v-bad">Copia modificada (prueba)</button></div>` : ''}
      <div id="v-res" style="margin-top:16px"></div>
      <div class="form-actions"><button class="btn" data-close>Cerrar</button></div>`,
    (m) => {
      const run = (hash, nombre) => {
        const r = intentar(() => S.verificarIntegridad(archivo.id, hash, nombre));
        if (!r) return;
        $('#v-res', m).innerHTML = r.verificacion.coincide
          ? `<div class="alert ok"><b>✓ Coincidente</b>Hash calculado: <code>${esc(hash)}</code><br>Verificación ${esc(r.verificacion.codigo)} registrada con usuario, fecha y hora.</div>`
          : `<div class="alert error"><b>✕ No coincidente · posible alteración</b>Hash calculado: <code>${esc(hash)}</code><br>Se generó la alerta ${esc(r.alerta.codigo)}. El hash original no se reemplaza.</div>`;
        $$('button:not([data-close])', m).forEach(b => { b.disabled = true; });
        $('#v-file', m).disabled = true;
        if (onDone) onDone(r);
      };
      $('#v-file', m).addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        $('#v-res', m).innerHTML = '<p class="muted small">Calculando SHA-256…</p>';
        run(await sha256File(file), file.name);
      });

document.body.innerHTML = "<div class=\"login-main\" style=\"min-height:100vh\">\n    <div class=\"login-card\" style=\"max-width:600px\">\n      <div class=\"eyebrow\">Consulta por código QR<\/div>\n      <h2 style=\"font-size:22px;margin-bottom:6px\">Referencia de evidencia<\/h2>\n      <form id=\"f\" style=\"display:flex;gap:10px;margin:14px 0\"><input type=\"text\" id=\"ref\" placeholder=\"CUSTODIA|EVD-2026-0001|…\"><button class=\"btn primary\" type=\"submit\">Consultar<\/button><\/form>\n      <div id=\"res\"><\/div>\n      <p class=\"note\"><a href=\"index.html\">Ir al inicio de sesión<\/a><\/p>\n    <\/div>\n  <\/div>";

    const S = Store, { esc, $ } = UI;
    const consultar = (ref) => {
      const box = $('#res');
      const partes = String(ref).trim().split('|');
      const ev = S.db.evidencias.find(e => e.referencia_qr === String(ref).trim());
      if (partes[0] !== 'CUSTODIA' || !ev) {
        box.innerHTML = '<div class="alert error"><b>Referencia no válida</b>El código no corresponde a una evidencia registrada o fue alterado.</div>';
        return;
      }
      const u = S.me();
      if (!u) {
        box.innerHTML = `<div class="alert warn"><b>Referencia protegida · ${esc(partes[1])}</b>Para consultar la ficha debes iniciar sesión. La etiqueta no expone archivos ni datos confidenciales.</div>
          <a class="btn primary" href="index.html?next=${encodeURIComponent('evidencia.html?id=' + ev.id)}">Iniciar sesión para consultar</a>`;
        return;
      }
      if (!S.can('EVD_VER', u) && !(S.can('EVD_CREAR', u) && ev.id_recolector === u.id)) {
        S.log('Acceso denegado', 'QR', ev.codigo, 'Consulta de referencia QR sin permiso para ver evidencias', { inc: ev.id_incidente, ev: ev.id });
        S.save();
        box.innerHTML = `<div class="alert error"><b>Acceso denegado</b>Tu rol (${esc(S.rolDe(u).nombre)}) no tiene permiso para consultar evidencias. El intento quedó registrado.</div>`;
        return;
      }
      S.log('Consultó evidencia por QR', 'QR', ev.codigo, '', { inc: ev.id_incidente, ev: ev.id });
      S.save();
      UI.nav('evidencia.html?id=' + ev.id);
    };

<script>
document.addEventListener('DOMContentLoaded', function () {

(function () {
  let cur = 'index.html', timers = [];
  const setInt = window.setInterval.bind(window);
  window.setInterval = function (fn, ms) { const id = setInt(fn, ms); timers.push(id); return id; };
  const actual = () => location.hash.replace(/^#\/?/, '') || 'index.html';
  function render() {
    cur = actual();
    const r = __ROUTES[cur.split('?')[0]] || __ROUTES['index.html'];
    timers.forEach(clearInterval); timers = [];
    document.title = r.title;
    window.scrollTo(0, 0);
    r.render();
  }
  UI.current = () => cur;
  UI.__query = () => { const i = cur.indexOf('?'); return i < 0 ? '' : cur.slice(i); };
  UI.nav = (url) => { url = String(url).replace(/^#?\/?/, ''); if (url === cur) render(); else location.hash = '#/' + url; };
  UI.reload = render;
  UI.replace = (url) => { cur = url; history.replaceState(null, '', '#/' + url); };
  window.addEventListener('hashchange', render);
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (a && /^[a-z\-]+\.html/i.test(a.getAttribute('href'))) { e.preventDefault(); UI.nav(a.getAttribute('href')); }
  });
  render();
})();

});
</script>
